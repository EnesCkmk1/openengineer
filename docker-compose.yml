services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: openengineer
      POSTGRES_PASSWORD: openengineer
      POSTGRES_DB: openengineer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - openengineer-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openengineer -d openengineer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openengineer-pg:
